version: '3.8'

services:
  mongo-db:
    image: mongo:6.0
    container_name: ats-mongo
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: mongosh --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" | grep -q "1"
      interval: 5s
      timeout: 5s
      retries: 5
